# =====================================================================
#  OBJECTIF DE RECHERCHE — ce que le candidat cherche.
#
#  Tout le robot s'y adapte : consignes envoyées à DeepSeek (formulaires,
#  CV, lettre, bilan, extraction des offres), email de candidature, filtre
#  du type de contrat, tri du domaine. Rempli par FORMULAIRE.bat.
#
#  Ces valeurs sont recopiées TELLES QUELLES dans des phrases : respecte
#  les exemples (minuscules, pas de point final).
# =====================================================================

type: "stage"                          # stage | alternance | emploi
contrats_acceptes: ["stage"]           # contrats acceptés parmi : stage, alternance, cdi, cdd, freelance

nom_fr: "stage de fin d'études"        # ce que tu cherches, en quelques mots
nom_en: "end-of-studies internship"
sigle: "PFE"                           # PFE, PFA… (vide si aucun)

duree_fr: "6 mois"                     # vide s'il n'y a pas de durée (ex. CDI)
duree_en: "6 months"
duree_adjectif_en: "6-month"           # la durée employée comme adjectif en anglais

date_debut_fr: "1er mars 2027"      # vide = disponible dès que possible
date_debut_en: "March 1, 2027"
mois_debut_fr: "mars 2027"

conventionne: true                     # stage sous convention de l'école (true / false)

statut_fr: "élève ingénieur"                     # ta situation, en 2-3 mots
statut_long_fr: "élève-ingénieur en dernière année"
presentation_fr: "Élève-ingénieur en Génie Informatique & IA à l'École d'Ingénieurs XX de Rabat"   # une demi-phrase
